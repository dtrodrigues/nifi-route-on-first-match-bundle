# Keeps the commit-pinned actions in the workflows up to date
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a compromised one is likely caught first
    cooldown:
      default-days: 7
  # Dependabot reads this file only from main, so the NiFi 1.x branch needs its own entry
  - package-ecosystem: github-actions
    directory: /
    target-branch: nifi-1.x
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
