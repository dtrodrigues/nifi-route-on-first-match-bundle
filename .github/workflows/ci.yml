# Builds and tests the snapshot NAR on every push and pull request, and keeps the NAR as a downloadable artifact
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older run's result irrelevant
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The NiFi parent pom requires at least this version, which the runner image may not have yet
  MAVEN_VERSION: 3.9.16

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install Maven ${{ env.MAVEN_VERSION }}
        run: |
          curl -fsSL "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      # Maven runs npm ci for the Advanced UI, which reuses packages from this cache
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('nifi-route-on-first-match-ui/src/main/frontend/package-lock.json') }}
          restore-keys: npm-

      # Builds the Advanced UI, runs the Java and frontend tests, and packages the NAR
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload NAR
        uses: actions/upload-artifact@v4
        with:
          name: nifi-route-on-first-match-nar
          path: nifi-route-on-first-match-nar/target/*.nar
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore
