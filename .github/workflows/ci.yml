# Builds and tests the snapshot NAR on every push and pull request, and keeps the NAR as a downloadable artifact
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older run's result irrelevant
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing later in the job pushes, so do not leave the token in .git/config
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # The NiFi 1.x parent pom refuses to build on Java 21 or later
          java-version: 17
          cache: maven

      # Maven runs npm ci for the Advanced UI, which reuses packages from this cache
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('nifi-route-on-first-match-ui/src/main/frontend/package-lock.json') }}
          restore-keys: npm-

      # Builds the Advanced UI, runs the Java and frontend tests, and packages the NAR
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      # Uploaded unzipped, so it downloads as the .nar file itself; the artifact is named after the file
      - name: Upload NAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: nifi-route-on-first-match-nar/target/*.nar
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore
