# Builds and tests the snapshot NAR on every push and pull request, and keeps the NAR as a downloadable artifact
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older run's result irrelevant
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The NiFi parent pom requires at least this version, which the runner image may not have yet
  MAVEN_VERSION: 3.9.16

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing later in the job pushes, so do not leave the token in .git/config
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install Maven ${{ env.MAVEN_VERSION }}
        run: |
          curl -fsSL "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      # Maven runs npm ci for the Advanced UI, which reuses packages from this cache
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('nifi-route-on-first-match-ui/src/main/frontend/package-lock.json') }}
          restore-keys: npm-

      # Builds the Advanced UI, runs the Java and frontend tests, and packages the NAR
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      # Uploaded unzipped, so it downloads as the .nar file itself; the artifact is named after the file
      - name: Upload NAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: nifi-route-on-first-match-nar/target/*.nar
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore
